<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Projetos DIEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#F4F9FF;--bg-2:#ffffff;--panel:#ffffff;--panel-2:#eef4fd;--line:#d5e2f2;--line-soft:#e6eefb;
  --ink:#1c2540;--ink-dim:#5a6883;--ink-faint:#98a2b8;
  --late:#e5484d;--ontrack:#3b6fe0;--done:#12a06a;--idle:#aab4c8;--now:#e5484d;
  --row-h:2.9rem;--list-w:33%;--list-w-min:22rem;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:clamp(14px,1.05vw,25px);height:100%}
body{margin:0;height:100%;font-family:"Inter",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding:1.1rem 1.4rem 0.9rem}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;position:relative;min-height:7rem;background:linear-gradient(180deg,#e6f1ff 0%,transparent 100%);border-radius:.9rem;padding:.7rem 1rem .55rem}
.head-left{display:flex;align-items:center;gap:.4rem;min-width:0;padding-top:.25rem}
.head-right{display:flex;flex-direction:column;align-items:flex-end;gap:.55rem}
.cnt-logo{height:2rem;width:auto;display:block}
.title-wrap,.controls{position:relative;z-index:1}
.banner-globe{flex:0 0 auto;width:6.6rem;height:6.6rem;opacity:.62;pointer-events:none}
.title-wrap{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.eyebrow{font-family:"Archivo";font-weight:600;font-size:.72rem;letter-spacing:.14em;color:var(--ink-faint)}
h1{font-family:"Archivo";font-weight:800;font-size:1.55rem;line-height:1;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:.6rem;padding:.2rem;gap:.15rem}
.seg button{font-family:"Archivo";font-weight:600;font-size:.8rem;color:var(--ink-dim);background:transparent;border:0;padding:.32rem .7rem;border-radius:.42rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,30,60,.12)}
select,.filebtn{font-family:"Inter";font-weight:500;font-size:.82rem;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:.55rem;padding:.36rem .55rem;cursor:pointer}
select:disabled{opacity:.45;cursor:default}
.filebtn{font-family:"Archivo";font-weight:600}
.filebtn:hover{background:var(--panel-2)}
.status-pill{display:flex;align-items:center;gap:.45rem;font-size:.76rem;color:var(--ink-dim);padding-left:.3rem}
.live-dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--done)}
.live-dot.demo{background:var(--now)} .live-dot.err{background:var(--late)}
.metrics{display:flex;gap:.8rem;align-items:stretch;margin:1rem 0 .9rem;flex-wrap:wrap}
.counters{flex:1 1 30rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;min-width:0}
.stat{position:relative;background:var(--bg-2);border:1px solid var(--line);border-radius:.9rem;padding:.85rem 1rem .95rem;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.28rem;background:var(--c)}
.stat .num{font-family:"Archivo";font-weight:800;font-size:2.4rem;line-height:.95;letter-spacing:-.02em;color:var(--c)}
.stat .lab{font-family:"Archivo";font-weight:600;font-size:.82rem;color:var(--ink-dim);margin-top:.25rem}
.stat .sub{font-size:.68rem;color:var(--ink-faint);margin-top:.05rem}
.stat.late{--c:var(--late)}.stat.ontrack{--c:var(--ontrack)}.stat.done{--c:var(--done)}.stat.total{--c:var(--ink-dim)}
.stat.total .num{color:var(--ink)}
.board{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg-2);border:1px solid var(--line);border-radius:1rem;overflow:hidden;position:relative;box-shadow:0 1px 3px rgba(20,30,60,.05)}
.board-head{display:flex;align-items:stretch;border-bottom:1px solid var(--line);height:2.4rem;flex:0 0 auto;background:var(--panel-2)}
.head-info{width:var(--list-w);min-width:var(--list-w-min);display:flex;align-items:center;gap:1rem;padding:0 1rem;border-right:1px solid var(--line)}
.head-info .col-label{font-family:"Archivo";font-weight:600;font-size:.72rem;letter-spacing:.1em;color:var(--ink-faint)}
.legend{display:flex;gap:.9rem;margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:.35rem;font-size:.68rem;color:var(--ink-dim)}
.legend i{width:.7rem;height:.7rem;border-radius:.2rem;display:inline-block}
.head-axis{position:relative;flex:1}
.tick{position:absolute;top:0;bottom:0;display:flex;align-items:center}
.tick .lbl{font-family:"Archivo";font-weight:600;font-size:.68rem;color:var(--ink-faint);padding-left:.35rem;white-space:nowrap}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.grid{display:flex;min-height:100%}
.list{width:var(--list-w);min-width:var(--list-w-min);flex:0 0 auto;border-right:1px solid var(--line)}
.track{position:relative;flex:1}
.axis-lines{position:absolute;inset:0;pointer-events:none}
.axis-lines .vline{position:absolute;top:0;bottom:0;width:1px;background:var(--line-soft)}
.today{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--now);z-index:4}
.today .cap{position:absolute;top:.15rem;left:.25rem;font-family:"Archivo";font-weight:700;font-size:.6rem;letter-spacing:.08em;color:#fff;background:var(--now);padding:.08rem .3rem;border-radius:.25rem}

/* ---- linha de projeto (recolhida = resumo) ---- */
.prow{height:var(--row-h);display:flex;align-items:center;gap:.55rem;padding:0 1rem;border-bottom:1px solid var(--line-soft);cursor:pointer;background:var(--panel-2)}
.prow:hover{background:#eef2fb}
.chev{width:1rem;color:var(--ink-faint);font-size:.8rem;transition:transform .12s;flex:0 0 auto}
.prow.open .chev{transform:rotate(90deg)}
.pdot{width:.7rem;height:.7rem;border-radius:.2rem;flex:0 0 auto}
.pname{font-family:"Archivo";font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.pcount{font-size:.72rem;color:var(--ink-dim);flex:0 0 auto}
.pcount b{color:var(--late)}
.ptrow{height:var(--row-h);position:relative;border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
.pspan{position:absolute;top:50%;transform:translateY(-50%);height:.5rem;border-radius:.3rem;background:rgba(59,111,224,.14)}
/* marco como LINHA (similar ao Hoje) */
.mline{position:absolute;top:.28rem;bottom:.28rem;width:.9rem;transform:translateX(-50%);z-index:2;cursor:pointer}
.mline::after{content:"";position:absolute;left:50%;top:0;bottom:0;transform:translateX(-50%);border-left:2px solid var(--c)}
.mline::before{content:"";position:absolute;top:-.15rem;left:50%;transform:translate(-50%,0) rotate(45deg);width:.6rem;height:.6rem;background:var(--c);border-radius:.14rem}
.mline.late{--c:var(--late)}.mline.ontrack{--c:var(--ontrack)}.mline.done{--c:var(--done)}.mline.idle{--c:var(--idle)}
.marker{cursor:pointer}
/* caixinha de hover no estilo dos cards do topo */
.tip{position:fixed;z-index:60;pointer-events:none;background:#fff;border:1px solid var(--line);border-left:.28rem solid var(--tc,var(--ink-dim));border-radius:.7rem;box-shadow:0 10px 28px rgba(20,30,60,.18);padding:.6rem .75rem;max-width:22rem;opacity:0;transition:opacity .1s;display:none}
.tip.show{opacity:1;display:block}
.tip .t-name{font-family:"Archivo";font-weight:700;font-size:.92rem;color:var(--ink);line-height:1.2;margin-bottom:.28rem;white-space:normal}
.tip .t-row{display:flex;align-items:center;gap:.75rem;font-size:.78rem;color:var(--ink-dim)}
.tip .t-status{display:inline-flex;align-items:center;gap:.35rem;font-family:"Archivo";font-weight:600;color:var(--tc)}
.tip .t-dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--tc);box-shadow:inset 0 0 0 1.5px var(--tc)}
.tip.idle .t-dot{background:transparent}
.tip .t-hint{margin-top:.35rem;padding-top:.35rem;border-top:1px solid var(--line-soft);font-size:.68rem;color:var(--tc);font-weight:600}

/* ---- marcos em detalhe (expandido) ---- */
.lrow{height:var(--row-h);display:flex;align-items:center;gap:.7rem;padding:0 1rem 0 2.2rem;border-bottom:1px solid var(--line-soft)}
.lrow .mname{font-weight:500;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;color:var(--ink);text-decoration:none}
a.mname:hover{color:var(--ontrack);text-decoration:underline}
a.mname .ext{color:var(--ink-faint);font-size:.72rem}
a.mname:hover .ext{color:var(--ontrack)}
.mdate{font-family:"Archivo";font-weight:600;font-size:.8rem;color:var(--ink-dim);flex:0 0 auto}
.mdate.late{color:var(--late)}
.avatar{width:1.6rem;height:1.6rem;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-family:"Archivo";font-weight:700;font-size:.68rem;color:#12203f;border:1.5px solid rgba(0,0,0,.06)}
.sdot{width:.6rem;height:.6rem;border-radius:50%;flex:0 0 auto}
.sdot.late{background:var(--late)}.sdot.ontrack{background:var(--ontrack)}.sdot.done{background:var(--done)}.sdot.idle{background:transparent;box-shadow:inset 0 0 0 1.5px var(--idle)}
.trow{height:var(--row-h);position:relative;border-bottom:1px solid var(--line-soft)}
.bar{position:absolute;top:50%;transform:translateY(-50%);height:.95rem;border-radius:.5rem;min-width:.5rem;overflow:hidden;background:rgba(20,30,60,.05);box-shadow:inset 0 0 0 1px rgba(20,30,60,.06)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:.5rem}
.bar.idle{background:transparent;box-shadow:inset 0 0 0 1.5px var(--idle)}
.bar.idle .fill{display:none}
.bar.late .fill{background:var(--late)}
.bar.ontrack .fill{background:var(--ontrack)}
.bar.done .fill{background:var(--done)}
.marker{position:absolute;top:50%;transform:translate(-50%,-50%) rotate(45deg);width:.8rem;height:.8rem;border-radius:.16rem;z-index:2;border:1.5px solid #fff}
.marker.late{background:var(--late)}.marker.ontrack{background:var(--ontrack)}.marker.done{background:var(--done)}.marker.idle{background:var(--idle)}
.bar-face{position:absolute;top:50%;transform:translateY(-50%);width:1.4rem;height:1.4rem;border-radius:50%;z-index:2;border:1.5px solid #fff;display:grid;place-items:center;font-family:"Archivo";font-weight:700;font-size:.6rem;color:#12203f}

.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2rem;background:rgba(255,255,255,.6)}
.empty h2{font-family:"Archivo";font-weight:700;font-size:1.1rem;margin:0 0 .3rem}
.empty p{color:var(--ink-dim);font-size:.85rem;margin:0 auto;max-width:30rem;line-height:1.5}
.dropzone.drag{outline:2px dashed var(--ontrack);outline-offset:-6px}
footer{display:flex;justify-content:space-between;align-items:center;padding-top:.55rem;font-size:.72rem;color:var(--ink-faint)}
footer .demo-tag{color:var(--now);font-weight:600}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="head-left">
      <div class="title-wrap">
        <div class="eyebrow">CLICKUP · PAINEL DE EXECUÇÃO</div>
        <h1 id="projTitle">Projetos DIEX</h1>
      </div>
      <canvas id="globe" class="banner-globe" aria-hidden="true"></canvas>
    </div>
    <div class="head-right">
      <img class="cnt-logo" id="cntLogo" alt="Confederação Nacional do Transporte" />
      <div class="controls">
        <div class="seg" id="viewSeg" role="group" aria-label="Modo de visualização">
          <button data-view="ano" aria-pressed="true">Anual</button>
          <button data-view="mes" aria-pressed="false">Mensal</button>
        </div>
        <select id="projSel" aria-label="Projeto"></select>
        <select id="yearSel" aria-label="Ano"></select>
        <select id="monthSel" aria-label="Mês" disabled></select>
        <button class="filebtn" id="expandBtn" title="Expandir ou recolher todos os projetos">Expandir tudo</button>
        <button class="filebtn" id="pickBtn" title="Carregar um CSV do ClickUp">Trocar CSV</button>
        <input type="file" id="fileInput" accept=".csv,text/csv" hidden />
        <div class="status-pill"><span class="live-dot demo" id="liveDot"></span><span id="liveTxt">demo</span></div>
      </div>
    </div>
  </header>

  <section class="metrics">
    <div class="counters" id="counters"></div>
  </section>

  <div class="tip" id="tip"></div>
  <div class="board dropzone" id="board">
    <div class="board-head">
      <div class="head-info">
        <span class="col-label">PROJETO / MARCO</span>
        <div class="legend" id="legend"></div>
      </div>
      <div class="head-axis" id="axisHead"></div>
    </div>
    <div class="scroll">
      <div class="grid">
        <div class="list" id="listCol"></div>
        <div class="track" id="trackCol"><div class="axis-lines" id="axisLines"></div></div>
      </div>
    </div>
    <div class="empty" id="emptyState" style="display:none">
      <div>
        <h2 id="emptyTitle">Arraste o CSV do ClickUp aqui</h2>
        <p id="emptyMsg">Exporte a lista no ClickUp (ou deixe o data.csv ao lado da página) e solte o arquivo nesta tela — ou clique em <b>Trocar CSV</b> no topo.</p>
      </div>
    </div>
  </div>

  <footer><span id="foot"></span><span id="footRight"></span></footer>
</div>

<script>
/* ============================================================================
   CONFIGURAÇÃO
   ============================================================================ */
const CONFIG = {
  CSV_URL: "data.csv",
  TITLE: "Projetos DIEX",        // título da página (o ano atual é acrescentado sozinho)
  PROJECT_NAME: "SIRGEO Creativity", // usado só no modo demo
  RELOAD_MINUTES: 30,
  START_VIEW: "ano",
  NOT_STARTED_STATUSES: ["a fazer","to do","aberto","backlog","pendente","novo","não iniciado","nao iniciado"],
  // Força a cor de status específicos (tem prioridade sobre a cor vinda do CSV).
  // A chave é o nome do status em minúsculas. Adicione outros se precisar.
  STATUS_COLORS: {
    "validação / ajuste": "#F2C94C"
  },
  HEADERS: {
    name:   ["task name","name","nome da tarefa","nome","tarefa","task"],
    status: ["status","situação","situacao","status name"],
    statusType:["status type","tipo de status"],
    statusColor:["status color","cor do status","status colour"],
    due:    ["due date","due date (unix)","data de entrega","data de vencimento","prazo","vencimento","due"],
    start:  ["start date","start date (unix)","data de início","data de inicio","início","inicio","start"],
    assignee:["assignees","assignee","responsável","responsavel","responsáveis","responsaveis","atribuído a","atribuido a"],
    list:["list","lista","projeto","project","list name","nome da lista"],
    url:["task url","url","link","task link","url da tarefa"],
    groupStatus:["group status","status do projeto","status do grupo"],
    groupColor:["group status color","cor do projeto","cor do grupo","group color"]
  }
};
const CURR_YEAR = new Date().getFullYear();

/* ---------- DEMO ---------- */
const TEAM={ana:["Ana Ribeiro","AR"],marc:["Marcos Costa","MC"],julia:["Júlia Souza","JS"],pedro:["Pedro Lima","PL"]};
function d(s){const[m,day,y]=s.split("/").map(Number);return new Date(2000+y,m-1,day).getTime();}
const DEMO=[
  ["Autenticação","5/24/26","ana","done","SIRGEO"],["Usuários e Perfil","8/9/26","julia","done","SIRGEO"],
  ["Veículos","8/9/26","pedro","","SIRGEO"],["Macroplanejamento","8/23/26","ana","","SIRGEO"],
  ["Vinculação de rotas","8/23/26","marc","","SIRGEO"],["Plano de Rota","9/20/26","pedro","","SIRGEO"],
  ["Diário (Planejamento)","10/18/26","ana","","SIRGEO"],["Tracking","11/1/26","marc","","SIRGEO"],
  ["Eventos","11/15/26","julia","","SIRGEO"],["Coleta","12/23/26","marc","","SIRGEO"],
  ["Cadastro de motoristas","10/5/26","ana","done","SISVIAS"],["Telemetria","11/30/26","marc","idle","SISVIAS"],
  ["Cercas virtuais","12/10/26","pedro","","SISVIAS"],
  ["Mapa base","10/2/26","julia","done","MAPOTECA"],["Camadas temáticas","11/20/26","ana","","MAPOTECA"],
];
function buildDemo(){
  const COLOR={done:"#2fd48a",idle:"#9aa6bd",open:"#4d84ff"};
  const PSTATUS={SIRGEO:["Em andamento","#4d84ff"],SISVIAS:["Parado","#e5484d"],MAPOTECA:["Concluído","#2fd48a"]};
  return DEMO.map((t,i)=>({id:"d"+i,name:t[0],due:d(t[1]),start:null,
    statusName:t[3]==="done"?"Concluído":(t[3]==="idle"?"A fazer":"Em andamento"),
    statusType:t[3]==="done"?"done":"open",
    statusColor:t[3]==="done"?COLOR.done:(t[3]==="idle"?COLOR.idle:COLOR.open),
    idleFlag:t[3]==="idle",
    owner:mkOwner(TEAM[t[2]][0]),project:t[4],
    groupStatus:(PSTATUS[t[4]]||["",""])[0],groupColor:(PSTATUS[t[4]]||["",""])[1]}));
}

/* ============================================================================
   PARSER DE CSV
   ============================================================================ */
function parseCSV(text){
  const rows=[]; let row=[],field="",q=false;
  text=text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; } else field+=c; }
    else{
      if(c==='"')q=true;
      else if(c===','){row.push(field);field="";}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field="";}
      else if(c==='\r'){}
      else field+=c;
    }
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.length>1||(r[0]&&r[0].trim()));
}
function findCol(headers,synonyms){
  const norm=headers.map(h=>h.trim().toLowerCase());
  for(const s of synonyms){ const i=norm.indexOf(s); if(i>=0)return i; }
  for(const s of synonyms){ const i=norm.findIndex(h=>h.includes(s)); if(i>=0)return i; }
  return -1;
}
function parseDate(v){
  if(v==null)return null; v=String(v).trim(); if(!v)return null;
  if(/^\d{10}$/.test(v))return Number(v)*1000;
  if(/^\d{13}$/.test(v))return Number(v);
  const t=Date.parse(v); return isNaN(t)?null:t;
}
function firstAssignee(v){
  if(!v)return null;
  let s=String(v).replace(/^\[|\]$/g,"").trim();
  if(!s)return null;
  return s.split(/[,;|]/)[0].trim() || null;
}
function csvToTasks(text){
  const rows=parseCSV(text);
  if(rows.length<2) throw new Error("CSV vazio ou sem linhas de dados.");
  const headers=rows[0];
  const ci={
    name:findCol(headers,CONFIG.HEADERS.name), status:findCol(headers,CONFIG.HEADERS.status),
    statusType:findCol(headers,CONFIG.HEADERS.statusType), statusColor:findCol(headers,CONFIG.HEADERS.statusColor),
    due:findCol(headers,CONFIG.HEADERS.due),
    start:findCol(headers,CONFIG.HEADERS.start), assignee:findCol(headers,CONFIG.HEADERS.assignee),
    list:findCol(headers,CONFIG.HEADERS.list), url:findCol(headers,CONFIG.HEADERS.url),
    groupStatus:findCol(headers,CONFIG.HEADERS.groupStatus), groupColor:findCol(headers,CONFIG.HEADERS.groupColor)
  };
  if(ci.name<0) throw new Error('Não achei a coluna do nome da tarefa. Cabeçalhos lidos: '+headers.join(" | "));
  if(ci.due<0)  throw new Error('Não achei a coluna de data de entrega (due date). Cabeçalhos lidos: '+headers.join(" | "));
  const out=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row[ci.name])continue;
    const due=parseDate(row[ci.due]); if(due==null)continue;
    const statusName=(ci.status>=0?row[ci.status]:"")||"";
    out.push({
      id:"c"+r, name:row[ci.name].trim(), due,
      start: ci.start>=0?parseDate(row[ci.start]):null,
      statusName, statusType:(ci.statusType>=0?(row[ci.statusType]||"open"):"open"),
      statusColor: ci.statusColor>=0 ? (row[ci.statusColor]||"").trim() : "",
      idleFlag: CONFIG.NOT_STARTED_STATUSES.includes(statusName.toLowerCase()),
      owner: mkOwner(ci.assignee>=0?firstAssignee(row[ci.assignee]):null),
      project: (ci.list>=0 ? (row[ci.list]||"").trim() : "") || "Sem projeto",
      url: ci.url>=0 ? (row[ci.url]||"").trim() : "",
      groupStatus: ci.groupStatus>=0 ? (row[ci.groupStatus]||"").trim() : "",
      groupColor: ci.groupColor>=0 ? (row[ci.groupColor]||"").trim() : ""
    });
  }
  if(out.length===0) throw new Error("Nenhuma tarefa com data de entrega encontrada no CSV.");
  return out;
}
function mkOwner(name){
  if(!name)return null;
  const parts=name.split(/\s+/).filter(Boolean);
  const initials=((parts[0]||"")[0]||"")+((parts[1]||"")[0]||parts[0][1]||"");
  let h=0; for(const ch of name)h=(h*31+ch.charCodeAt(0))>>>0;
  const palette=["#9cc0ff","#ffd98a","#93e6bf","#e0b6ff","#ffb3c4","#8fe4e4","#ffc79c","#bcc6ff"];
  return {name,initials:initials.toUpperCase(),color:palette[h%palette.length],avatar:null};
}

/* ============================================================================
   CLASSIFICAÇÃO + ESTADO
   ============================================================================ */
function classify(m,now){
  const done=m.statusType==="done"||m.statusType==="closed"||/concl|done|complete|closed|fechad|entreg/i.test(m.statusName);
  if(done)return"done";
  if(m.due&&m.due<now)return"late";
  if(m.idleFlag)return"idle";
  return"ontrack";
}
// cor do marco = cor do status no ClickUp; se não vier, cai na cor por data (classify)
const CLS_COLOR={late:"#e5484d",ontrack:"#4d84ff",done:"#2fd48a",idle:"#9aa6bd"};
function normHex(c){c=(c||"").trim();if(!c)return"";return /^#/.test(c)?c:("#"+c.replace(/^0x/,""));}
function statusKey(s){return (s||"").toLowerCase().replace(/\s*\/\s*/g," / ").replace(/\s+/g," ").trim();}
function markColor(m,cls){return normHex((CONFIG.STATUS_COLORS||{})[statusKey(m.statusName)])||normHex(m.statusColor)||CLS_COLOR[cls||"ontrack"];}
// cor do projeto = status da tarefa-mãe (se veio no CSV); senão, saúde agregada dos marcos
function groupColorFor(g,now){
  const wc=g.ms.find(m=>normHex(m.groupColor));
  if(wc) return normHex(wc.groupColor);
  let late=0,done=0,idle=0; const tot=g.ms.length;
  g.ms.forEach(m=>{const c=classify(m,now); if(c==="late")late++; else if(c==="done")done++; else if(c==="idle")idle++;});
  if(late) return CLS_COLOR.late;
  if(tot&&done===tot) return CLS_COLOR.done;
  if(tot&&idle===tot) return CLS_COLOR.idle;
  return CLS_COLOR.ontrack;
}
function groupStatusFor(g){const w=g.ms.find(m=>(m.groupStatus||"").trim());return w?w.groupStatus.trim():"";}
const MESES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const MESES_LONGOS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
let ALL=[],VIEW=CONFIG.START_VIEW,YEAR=CURR_YEAR,MONTH=new Date().getMonth(),PROJECT="Todos",SOURCE="demo",FILENAME="";
const EXPANDED=new Set();  // projetos abertos (detalhe dos marcos)

function projectsInData(){return[...new Set(ALL.map(m=>m.project))].sort((a,b)=>a.localeCompare(b));}
const PROJ_PALETTE=["#3b6fe0","#12a06a","#e08a1e","#8b5cf6","#e5487e","#0ea5b7","#d9534f","#6366f1"];
function projColor(name){let h=0;for(const c of(name||""))h=(h*31+c.charCodeAt(0))>>>0;return PROJ_PALETTE[h%PROJ_PALETTE.length];}
function deriveStarts(list){
  const sorted=[...list].sort((a,b)=>a.due-b.due); let prev=null;
  for(const m of sorted){
    if(m.start==null){const lead=14*864e5;m.effStart=prev!=null?Math.min(prev,m.due-lead):(m.due-lead);}
    else m.effStart=m.start; prev=m.due;
  }
  return list;
}
function yearsInData(){const ys=new Set(ALL.map(m=>new Date(m.due).getFullYear()));if(!ys.size)ys.add(YEAR);return[...ys].sort();}
function domainFor(){
  if(VIEW==="mes")return{start:new Date(YEAR,MONTH,1).getTime(),end:new Date(YEAR,MONTH+1,0,23,59,59).getTime()};
  return{start:new Date(YEAR,0,1).getTime(),end:new Date(YEAR,11,31,23,59,59).getTime()};
}
function visible(){
  return ALL.filter(m=>{
    if(PROJECT!=="Todos"&&m.project!==PROJECT)return false;
    const dt=new Date(m.due);
    return VIEW==="mes"?(dt.getFullYear()===YEAR&&dt.getMonth()===MONTH):dt.getFullYear()===YEAR;
  });
}
function groupsFor(rows){
  const map=new Map();
  for(const m of rows){ if(!map.has(m.project))map.set(m.project,[]); map.get(m.project).push(m); }
  return [...map.entries()].map(([name,ms])=>({name,ms:ms.sort((a,b)=>a.due-b.due)})).sort((a,b)=>a.name.localeCompare(b.name));
}
function pct(t,dom){return Math.max(0,Math.min(100,(t-dom.start)/(dom.end-dom.start)*100));}

/* ============================================================================
   RENDER
   ============================================================================ */
function render(){
  const now=Date.now(),dom=domainFor(),rows=visible();
  // legenda dinâmica: status reais do ClickUp presentes na visão
  const seenSt=new Map();
  rows.forEach(m=>{const nm=(m.statusName||"").trim();if(nm&&!seenSt.has(nm.toLowerCase()))seenSt.set(nm.toLowerCase(),{nm,c:markColor(m,classify(m,now))});});
  document.getElementById("legend").innerHTML=[...seenSt.values()].slice(0,10)
    .map(s=>`<span><i style="background:${s.c}"></i>${escapeHtml(s.nm)}</span>`).join("");
  const b={late:0,ontrack:0,done:0,idle:0};
  rows.forEach(m=>b[classify(m,now)]++);
  document.getElementById("counters").innerHTML=`
    <div class="stat late"><div class="num">${b.late}</div><div class="lab">Atrasados</div><div class="sub">passaram do prazo</div></div>
    <div class="stat ontrack"><div class="num">${b.ontrack+b.idle}</div><div class="lab">No prazo</div><div class="sub">${b.idle} não iniciados</div></div>
    <div class="stat done"><div class="num">${b.done}</div><div class="lab">Concluídos</div><div class="sub">entregues</div></div>
    <div class="stat total"><div class="num">${rows.length}</div><div class="lab">Marcos no período</div><div class="sub">${VIEW==="mes"?MESES_LONGOS[MONTH]+" / "+YEAR:"Ano de "+YEAR}</div></div>`;

  const axisHead=document.getElementById("axisHead"),axisLines=document.getElementById("axisLines");
  axisHead.innerHTML=""; axisLines.querySelectorAll(".vline,.today").forEach(n=>n.remove());
  const ticks=[];
  if(VIEW==="mes"){for(let day=1;day<=new Date(YEAR,MONTH+1,0).getDate();day+=7)ticks.push({t:new Date(YEAR,MONTH,day).getTime(),lbl:"dia "+day});}
  else{for(let mo=0;mo<12;mo++)ticks.push({t:new Date(YEAR,mo,1).getTime(),lbl:MESES[mo]});}
  ticks.forEach(tk=>{const x=pct(tk.t,dom);
    const h=document.createElement("div");h.className="tick";h.style.left=x+"%";h.innerHTML=`<span class="lbl">${tk.lbl}</span>`;axisHead.appendChild(h);
    const v=document.createElement("div");v.className="vline";v.style.left=x+"%";axisLines.appendChild(v);});
  if(now>=dom.start&&now<=dom.end){const tl=document.createElement("div");tl.className="today";tl.style.left=pct(now,dom)+"%";tl.innerHTML='<span class="cap">HOJE</span>';axisLines.appendChild(tl);}

  const listCol=document.getElementById("listCol"),trackCol=document.getElementById("trackCol");
  listCol.innerHTML=""; trackCol.querySelectorAll(".prow-t,.trow,.ptrow").forEach(n=>n.remove());
  const groups=groupsFor(rows);
  document.getElementById("emptyState").style.display = rows.length? "none":"grid";

  for(const g of groups){
    const open=EXPANDED.has(g.name), col=groupColorFor(g,now);
    const late=g.ms.filter(m=>classify(m,now)==="late").length;
    // ----- linha do projeto (esquerda) -----
    const pl=document.createElement("div");pl.className="prow"+(open?" open":"");pl.dataset.proj=g.name;
    pl.innerHTML=`<span class="chev">▶</span><span class="pdot" style="background:${col}"></span>
      <span class="pname">${escapeHtml(g.name)}</span>
      <span class="pcount">${g.ms.length} marcos${late?` · <b>${late} atrasados</b>`:""}</span>`;
    listCol.appendChild(pl);
    // ----- banda do projeto (direita): marcos como LINHAS -----
    const pt=document.createElement("div");pt.className="ptrow";
    const dues=g.ms.map(m=>m.due), starts=g.ms.map(m=>m.effStart);
    const x0=pct(Math.min(...starts),dom), x1=pct(Math.max(...dues),dom);
    let bands=`<div class="pspan" style="left:${Math.min(x0,x1)}%;width:${Math.max(.6,Math.abs(x1-x0))}%"></div>`;
    for(const m of g.ms){
      const cls=classify(m,now);
      bands+=`<div class="mline" style="left:${pct(m.due,dom)}%;--c:${markColor(m,cls)}" data-n="${escapeHtml(m.name)}" data-d="${fmtDate(m.due)}" data-s="${cls}" data-sn="${escapeHtml(m.statusName)}" data-c="${markColor(m,cls)}" data-u="${escapeHtml(m.url||"")}"></div>`;
    }
    pt.innerHTML=bands; trackCol.appendChild(pt);

    // ----- detalhe (expandido): um marco por linha -----
    if(open){
      for(const m of g.ms){
        const cls=classify(m,now),lt=cls==="late";
        const l=document.createElement("div");l.className="lrow";
        l.innerHTML=`<span class="sdot" style="background:${markColor(m,cls)};box-shadow:none"></span>${avatarHTML(m.owner)}${nameHTML(m)}<span class="mdate ${lt?"late":""}">${fmtDate(m.due)}</span>`;
        listCol.appendChild(l);
        const r=document.createElement("div");r.className="trow";
        const bx0=pct(m.effStart,dom),bx1=pct(m.due,dom),left=Math.min(bx0,bx1),width=Math.max(.6,Math.abs(bx1-bx0));
        let fill=100; if(cls==="ontrack")fill=m.effStart<m.due?Math.max(4,Math.min(100,(now-m.effStart)/(m.due-m.effStart)*100)):100; if(cls==="idle")fill=0;
        r.innerHTML=`<div class="bar ${cls==="idle"?"idle":cls}" style="left:${left}%;width:${width}%"><div class="fill" style="width:${fill}%;background:${markColor(m,cls)}"></div></div>
          <div class="marker" style="left:${bx1}%;background:${markColor(m,cls)}" data-n="${escapeHtml(m.name)}" data-d="${fmtDate(m.due)}" data-s="${cls}" data-sn="${escapeHtml(m.statusName)}" data-c="${markColor(m,cls)}" data-u="${escapeHtml(m.url||"")}"></div>${m.owner?faceHTML(m.owner,bx1):""}`;
        trackCol.appendChild(r);
      }
    }
  }

  const stamp=new Date();
  document.getElementById("foot").innerHTML=(SOURCE==="demo"?'<span class="demo-tag">● MODO DEMO</span> — ':"")+"Atualizado às "+stamp.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("footRight").textContent="Desenvolvido pela Coordenação de Tecnologia da Informação - CNT";
}
function nameHTML(m){return m.url
  ? `<a class="mname" href="${escapeHtml(m.url)}" target="_blank" rel="noopener" title="Abrir no ClickUp">${escapeHtml(m.name)} <span class="ext">↗</span></a>`
  : `<span class="mname">${escapeHtml(m.name)}</span>`;}
function avatarHTML(o){return o?`<span class="avatar" style="background:${o.color}">${o.initials}</span>`:`<span class="avatar" style="background:#dfe5f2;color:#8a95ac">–</span>`;}
function faceHTML(o,x){return o?`<span class="bar-face" style="left:${x}%;background:${o.color}">${o.initials}</span>`:"";}
function fmtDate(ms){const dt=new Date(ms);return String(dt.getDate()).padStart(2,"0")+"/"+String(dt.getMonth()+1).padStart(2,"0")+"/"+String(dt.getFullYear()).slice(2);}
function escapeHtml(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function buildProjSelect(){const sel=document.getElementById("projSel");const ps=projectsInData();sel.innerHTML="";

}
function buildYearSelect(){const sel=document.getElementById("yearSel");sel.innerHTML="";const ys=yearsInData();if(!ys.includes(YEAR))YEAR=ys[0];ys.forEach(y=>{const o=document.createElement("option");o.value=y;o.textContent=y;if(y===YEAR)o.selected=true;sel.appendChild(o);});}
function buildMonthSelect(){const sel=document.getElementById("monthSel");sel.innerHTML="";MESES_LONGOS.forEach((m,i)=>{const o=document.createElement("option");o.value=i;o.textContent=m;if(i===MONTH)o.selected=true;sel.appendChild(o);});}

  updateExpandBtn(); render();
});
// ---- caixinha de hover no marco (estilo card) ----
const tip=document.getElementById("tip");
const STLAB={late:"Atrasado",ontrack:"No prazo",done:"Concluído",idle:"Não iniciado"};
const STVAR={late:"var(--late)",ontrack:"var(--ontrack)",done:"var(--done)",idle:"var(--idle)"};
function tipPos(e){
  const pad=12,r=tip.getBoundingClientRect();
  let x=e.clientX+16,y=e.clientY+16;
  if(x+r.width>innerWidth-pad)x=e.clientX-r.width-16;
  if(y+r.height>innerHeight-pad)y=e.clientY-r.height-16;
  tip.style.left=Math.max(pad,x)+"px"; tip.style.top=Math.max(pad,y)+"px";
}
function showTip(el,e){
  const col=el.dataset.c||STVAR[el.dataset.s||"ontrack"];
  const label=el.dataset.sn||STLAB[el.dataset.s]||"";
  tip.className="tip"; tip.style.setProperty("--tc",col);
  const hint=el.dataset.u?`<div class="t-hint">Clique para abrir no ClickUp ↗</div>`:"";
  tip.innerHTML=`<div class="t-name">${el.dataset.n||""}</div>
    <div class="t-row"><span>${el.dataset.d||""}</span>
    <span class="t-status"><span class="t-dot"></span>${label}</span></div>${hint}`;
  tip.classList.add("show"); tipPos(e);
}
const trackEl=document.getElementById("trackCol");
trackEl.addEventListener("mouseover",e=>{const m=e.target.closest(".mline,.marker");if(m)showTip(m,e);});
trackEl.addEventListener("mousemove",e=>{if(tip.classList.contains("show")){const m=e.target.closest(".mline,.marker");if(m)tipPos(e);else tip.classList.remove("show");}});
trackEl.addEventListener("mouseout",e=>{const m=e.target.closest(".mline,.marker");if(m)tip.classList.remove("show");});
trackEl.addEventListener("click",e=>{const m=e.target.closest(".mline,.marker");if(m&&m.dataset.u)window.open(m.dataset.u,"_blank","noopener");});
document.querySelector(".scroll").addEventListener("scroll",()=>tip.classList.remove("show"));

});

function applyTasks(list,filename,src){ALL=deriveStarts(list);FILENAME=filename||"";SOURCE=src;buildProjSelect();buildYearSelect();updateExpandBtn();render();}
function readFile(file){
  const reader=new FileReader();
  reader.onload=()=>{ try{ applyTasks(csvToTasks(reader.result),file.name,"csv"); setState("csv"); }
    catch(err){ setState("err"); alert("Não consegui ler o CSV:\n\n"+err.message); } };
  reader.onerror=()=>{setState("err");alert("Falha ao abrir o arquivo.");};
  reader.readAsText(file,"utf-8");
}

  }catch(e){ return false; }
}

/* ============================================================================
   GLOBO 3D no banner (three.js, formas geométricas). Some se o three.js falhar.
   ============================================================================ */
function init3D(){
  const canvas=document.getElementById("globe");
  if(!window.THREE || !canvas){ if(canvas)canvas.style.display="none"; return; }
  const THREE=window.THREE;
  const box=()=>({w:canvas.clientWidth||106,h:canvas.clientHeight||106});
  let {w,h}=box();
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setSize(w,h,false);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(42,w/h,0.1,100); camera.position.set(0,0,7.2);
  const world=new THREE.Group(); scene.add(world);
  const core=new THREE.Mesh(new THREE.SphereGeometry(2.4,32,24),
    new THREE.MeshBasicMaterial({color:0xdbe6fb,transparent:true,opacity:0.5}));
  world.add(core);
  const grid=new THREE.Mesh(new THREE.SphereGeometry(2.42,20,14),
    new THREE.MeshBasicMaterial({color:0x9db2d8,wireframe:true,transparent:true,opacity:0.8}));
  world.add(grid);
  const ring=new THREE.Mesh(new THREE.RingGeometry(3.2,3.26,64),
    new THREE.MeshBasicMaterial({color:0xbfe3cf,side:THREE.DoubleSide,transparent:true,opacity:0.8}));
  ring.rotation.x=Math.PI/2.1; world.add(ring);
  [0x9db2d8,0xbfe3cf,0xf2c98a,0xbcc6ff,0x9db2d8].forEach((c,i,arr)=>{
    const phi=Math.acos(-1+(2*(i+0.5))/arr.length), theta=Math.PI*(1+Math.sqrt(5))*i;
    const p=new THREE.Mesh(new THREE.SphereGeometry(0.15,12,12),new THREE.MeshBasicMaterial({color:c}));
    p.position.setFromSphericalCoords(2.5,phi,theta); world.add(p);
  });
  world.rotation.x=0.4; let ry=0;
  function resize(){const b=box();renderer.setSize(b.w,b.h,false);camera.aspect=b.w/b.h;camera.updateProjectionMatrix();}
  addEventListener("resize",resize);
  (function loop(){ ry+=0.005; world.rotation.y=ry; renderer.render(scene,camera); requestAnimationFrame(loop); })();
}
if(document.readyState!=="loading") init3D(); else addEventListener("DOMContentLoaded",init3D);
